org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 compiles Kotlin itself. The standalone Kotlin Android plugin (2.2.10) is not compatible
# with AGP 9 — it expects the removed BaseExtension — so built-in Kotlin is used and only the
# Compose and kotlinx.serialization compiler sub-plugins are applied on top of it.
android.builtInKotlin=true
